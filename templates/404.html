<!doctype html>
<html lang="$htmlLang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f3e9">
  <title>$errorTitle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
$runtime
</head>
<body data-error-page>
  <header class="header wrap">
    <a class="wordmark" href="$homePath" aria-label="$home">babellino<span class="wordmark-dot">.</span></a>
    $languageSelector
  </header>
  <main class="not-found wrap">
    <p class="eyebrow">404</p>
    <h1 id="error-heading">$errorHeading</h1>
    <p id="error-message">$errorMessage</p>
    <a class="button" id="error-home" href="$homePath">$backHome</a>
  </main>
  <footer class="footer wrap"><span>© 2026 Babellino</span></footer>
</body>
</html>
