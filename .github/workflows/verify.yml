name: Verify website

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify boot splash reference assets
        run: python3 artwork/boot-splash/verify.py
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check desktop, mobile, keyboard navigation, and accessibility
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/babellino-preview.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          npm test
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
